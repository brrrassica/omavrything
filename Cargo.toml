[workspace]
resolver = "2"
members = [
    "crates/omavrything-core",
    "crates/omavrything-ntfs",
    "crates/omavrythingd",
    "crates/omavrything-cli",
    "crates/omavrything-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["omavrything contributors"]
repository = "https://github.com/omavrything/omavrything"
description = "Instant, index-backed file search for Omarchy Quattro, inspired by Voidtools Everything"

[workspace.dependencies]
omavrything-core = { path = "crates/omavrything-core" }
omavrything-ntfs = { path = "crates/omavrything-ntfs" }
omavrything-client = { path = "crates/omavrything-client" }

# Shared third-party dependencies (wired up in later milestones).
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
memchr = "2"
rayon = "1"
inotify = "0.11"
libc = "0.2"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
