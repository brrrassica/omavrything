[workspace]
resolver = "2"
members = [
    "crates/omavrything-core",
    "crates/omavrything-ntfs",
    "crates/omavrythingd",
    "crates/omavrything-cli",
    "crates/omavrything-client",
]
# The fuzz crate is its own workspace (it needs a nightly toolchain and the
# libFuzzer runtime), so keep it out of the stable-toolchain workspace jobs.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0-rc9"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Sam Ralial <sam@alatcerdas.tech>"]
repository = "https://github.com/brrrassica/omavrything"
description = "Instant, index-backed file search for Omarchy Quattro, inspired by Voidtools Everything"

[workspace.dependencies]
omavrything-core = { path = "crates/omavrything-core" }
omavrything-ntfs = { path = "crates/omavrything-ntfs" }
omavrything-client = { path = "crates/omavrything-client" }

# Shared third-party dependencies (wired up in later milestones).
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
memchr = "2"
rayon = "1"
inotify = "0.11"
libc = "0.2"
memmap2 = "0.9"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# Release profile tuned for the daemon's resident footprint (rc6 RSS spike).
# The default profile leaves 16 codegen units, no LTO, and full symbols, which
# inflates the resident text (RssFile) of a binary that links tokio, zbus, rayon,
# tracing, serde, and memchr. Fat LTO plus a single codegen unit lets the linker
# drop unreachable generic instantiations, and stripping removes the symbol
# tables that are otherwise mapped resident.
#
# `panic` is deliberately left at the default `unwind`: the NTFS startup path
# contains a malformed-record panic with `std::panic::catch_unwind`
# (see `contain_panic` in crates/omavrythingd/src/main.rs), and `panic = "abort"`
# would turn that contained panic into a process abort, regressing the 0.1.2
# robustness fix. The size win from `abort` is not worth that regression.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
