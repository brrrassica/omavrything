name: Release

# Publishing a `v*` tag builds the release archive and creates a GitHub release
# with the zip attached. The workflow can also be run manually against an
# existing tag from the Actions tab.
#
# The archive is built inside an official Arch container so the shipped binaries
# are linked against the same glibc and toolchain as the target platform
# (Omarchy Quattro / Arch Linux). The container bind-mounts the runner's local
# package cache, so pacman, the Rust toolchain, crates and build artifacts are
# reused instead of being re-downloaded for every release.
#
# The Rust toolchain is PINNED to an exact release (1.99.1) rather than the
# floating `stable` channel, so a release is reproducible and rustup never has
# to re-resolve the channel over the network. $CARGO_HOME/bin goes on PATH and
# the install runs under flock /ci/cache/locks/rustup.lock, so it neither
# re-downloads the rustup installer nor races another job on the shared cache.
#
# The release is DIGEST-PINNED: the version-bump PR commits the SHA-256 of the
# archive and of both binaries to scripts/daemon-checksums.txt. This workflow
# rebuilds the archive from the tag and verifies it against that pin before it
# publishes anything; a missing or mismatched pin fails the release. It does NOT
# re-pin the digests after publishing: that post-tag step in the 0.2.3 workflow
# could not even open its PR (GitHub Actions is not permitted to create pull
# requests) and forced a manual re-push just for the digest.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish release (Arch)
    runs-on: [self-hosted, opencode-sam]
    container:
      image: archlinux:base-devel
      volumes:
        - /home/github-runner/ci-cache/pacman-pkg:/var/cache/pacman/pkg
        - /home/github-runner/ci-cache/cargo:/ci/cache/cargo
        - /home/github-runner/ci-cache/rustup:/ci/cache/rustup
        - /home/github-runner/ci-cache/targets:/ci/cache/targets
        - /home/github-runner/ci-cache/locks:/ci/cache/locks
    env:
      CARGO_HOME: /ci/cache/cargo
      RUSTUP_HOME: /ci/cache/rustup
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_TARGET_DIR: /ci/cache/targets/${{ github.repository }}/${{ github.job }}
    steps:
      - name: Install dependencies (from the local pacman cache)
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          flock /ci/cache/locks/pacman.lock \
            pacman -Syu --noconfirm --needed --overwrite '*' git curl zip

      - uses: actions/checkout@v4
        with:
          # Check out the tag being released, not the default branch.
          ref: ${{ github.event.inputs.tag || github.ref }}


      # The build output lives in the runner's persistent cache, but the
      # repo's own scripts (scripts/build.sh, ci-smoke.sh, package-release.sh)
      # reference ./target, so link it back to the cache.
      - name: Point target/ at the persistent local cache
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          rm -rf target
          ln -s "$CARGO_TARGET_DIR" target
      - name: Put the cached cargo/rustup shims on PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      # Install under the cache lock so the action below only has to confirm
      # the toolchain is already present.
      - name: Pre-install the pinned toolchain under the cache lock
        run: |
          flock /ci/cache/locks/rustup.lock \
            rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - name: Install Rust toolchain (reused from RUSTUP_HOME)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Resolve the release tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The digest pin is only meaningful if the compiler is the one the pin
      # was produced with. 1.99.1 is the Rust release (commit 58cf8f9c3) the
      # version-bump PR used; the Arch container supplies the matching glibc,
      # gcc and binutils. Print the library versions so a mismatch is visible in
      # the log, and fail if rustc is not the pinned commit.
      - name: Verify the pinned toolchain
        run: |
          set -euo pipefail
          rustc -vV
          cargo --version
          pacman -Q glibc gcc binutils 2>/dev/null || true
          expected_rustc=58cf8f9c35b355199727627d07ae34a4e2846d67
          actual_rustc="$(rustc -vV | sed -n 's/^commit-hash: //p')"
          if [[ "$actual_rustc" != "$expected_rustc" ]]; then
            echo "error: rustc is not the pinned 1.99.1 release" >&2
            echo "       expected commit-hash $expected_rustc" >&2
            echo "       got               $actual_rustc" >&2
            exit 1
          fi

      - name: Build the release archive
        run: scripts/package-release.sh "${{ steps.tag.outputs.version }}"

      # The archive and both binaries must match the digests committed in the
      # tagged tree. If this fails, the release is not the reviewed artifact:
      # fail before creating the GitHub release rather than re-pinning it.
      - name: Verify the archive against the pinned digests
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.version }}"
          arch="$(uname -m)"
          name="omavrything-${version}-${arch}"
          pinned="scripts/daemon-checksums.txt"
          [[ -f "$pinned" ]] || {
            echo "error: $pinned is missing from the tagged tree" >&2
            exit 1
          }
          verify() {
            local file="$1"
            local expected actual
            expected="$(awk -v f="$file" '$2 == f { print $1; exit }' "$pinned")"
            if [[ -z "$expected" ]]; then
              echo "error: no pinned digest for $file in $pinned" >&2
              echo "       the version-bump PR must pin the release before tagging" >&2
              exit 1
            fi
            actual="$(sha256sum "dist/$file" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "error: reproducible build mismatch for $file" >&2
              echo "       pinned $expected" >&2
              echo "       built  $actual" >&2
              exit 1
            fi
            echo "verified $file  $expected"
          }
          verify "${name}.zip"
          verify "${name}/bin/omavrythingd"
          verify "${name}/bin/omavry"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: omavrything ${{ steps.tag.outputs.tag }}
          # The .sha256 asset is published for manual verification only. The
          # plugin's fetch-on-first-run bootstrap does NOT trust it: it verifies
          # the archive against the digest pinned in scripts/daemon-checksums.txt
          # (see scripts/fetch-daemon.sh), because the archive and this asset
          # live in the same mutable release.
          files: |
            dist/*.zip
            dist/*.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            omavrything ${{ steps.tag.outputs.tag }}

            Download the zip below, extract it, and run:

                sudo ./scripts/install.sh

            The single command installs the daemon, CLI, systemd unit, D-Bus
            policy, polkit action, man page, default config, and the shell
            plugin; creates the omavrything user; adds you to the omavrything
            group; reloads D-Bus; enables and starts the daemon; and installs,
            enables, and loads the shell plugin. The installer grants your
            session access to the daemon socket with an ACL, so the widget works
            immediately; the group change takes effect on your next login.

            See `docs/install.md` inside the archive for the full setup.
