name: Release

# Publishing a `v*` tag builds the release archive and creates a GitHub release
# with the zip attached. The workflow can also be run manually against an
# existing tag from the Actions tab.
#
# The archive is built inside an official Arch container so the shipped binaries
# are linked against the same glibc and toolchain as the target platform
# (Omarchy Quattro / Arch Linux). The container bind-mounts the runner's local
# package cache, so pacman, the Rust toolchain, crates and build artifacts are
# reused instead of being re-downloaded for every release.
#
# The compiler and linker are PINNED to the exact Arch packages that produced
# the committed digests: `rust 1:1.99.1-1` (rustc commit 58cf8f9c3) and
# `lld 23.1.3-4`. rustup is deliberately NOT used: even at the same version it
# produces different binaries, and the system linker version is embedded in the
# output. The Cargo registry path is also embedded in the binaries (dependency
# panic locations), so the build uses CARGO_HOME=/home/sam/.cargo, matching the
# build that committed the pins; that path is symlinked to the runner's
# persistent cargo cache.
#
# The release is DIGEST-PINNED: the version-bump PR commits the SHA-256 of the
# archive and of both binaries to scripts/daemon-checksums.txt. This workflow
# rebuilds the archive from the tag and verifies it against that pin before it
# publishes anything; a missing or mismatched pin fails the release. It does NOT
# re-pin the digests after publishing: that post-tag step in the 0.2.3 workflow
# could not even open its PR (GitHub Actions is not permitted to create pull
# requests) and forced a manual re-push just for the digest.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish release (Arch)
    runs-on: [self-hosted, opencode-sam]
    container:
      image: archlinux:base-devel
      volumes:
        - /home/github-runner/ci-cache/pacman-pkg:/var/cache/pacman/pkg
        # NOTE: no `ci-cache/cargo` and no CI target cache here. Untrusted PR
        # jobs run on GitHub-hosted runners and can never write this volume, so
        # a `config.toml`/`rustc-wrapper` left by a PR job cannot reach the
        # write-privileged release build. See the marketplace review finding.
        - /home/github-runner/release-cache/cargo:/ci/cache/cargo
        - /home/github-runner/release-cache/targets:/ci/cache/targets
        - /home/github-runner/ci-cache/locks:/ci/cache/locks
    env:
      # The pinned binaries embed this exact registry path in dependency panic
      # locations. It is symlinked to the runner's cache in the step below.
      CARGO_HOME: /home/sam/.cargo
      CARGO_TARGET_DIR: /ci/cache/targets/${{ github.repository }}/${{ github.job }}
    steps:
      # Fail fast with an actionable message rather than an obscure mount or
      # cargo error partway through the release.
      - name: Check the runner prerequisites
        run: |
          set -euo pipefail
          missing=0
          for dir in /var/cache/pacman/pkg /ci/cache/locks /ci/cache/cargo /ci/cache/targets; do
            if [[ ! -d "$dir" ]]; then
              echo "error: runner volume is not mounted: $dir" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            {
              echo ""
              echo "The self-hosted runner is missing a required volume. Create it:"
              echo ""
              echo "    sudo mkdir -p /home/github-runner/release-cache/{cargo,targets}"
              echo "    sudo mkdir -p /home/github-runner/ci-cache/{pacman-pkg,locks}"
              echo ""
              echo "release-cache is the write-privileged release cache. It is"
              echo "deliberately NOT shared with CI or with the pre-tag gate, so an"
              echo "untrusted job cannot leave configuration this build would execute."
            } >&2
            exit 1
          fi
          echo "runner volumes present"

      - name: Install dependencies (from the local pacman cache)
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          flock /ci/cache/locks/pacman.lock \
            pacman -Syu --noconfirm --needed --overwrite '*' git curl zip rust

      - uses: actions/checkout@v4
        with:
          # Check out the tag being released, not the default branch.
          ref: ${{ github.event.inputs.tag || github.ref }}
          # Do NOT persist the job token in the checkout's git config: this job
          # has `contents: write`, and a release build (or anything it shells
          # out to) must not inherit a credential it does not need. The release
          # step receives the token explicitly instead.
          persist-credentials: false


      # The build output lives in the runner's persistent cache, but the
      # repo's own scripts (scripts/build.sh, ci-smoke.sh, package-release.sh)
      # reference ./target, so link it back to the cache.
      - name: Point target/ at the persistent local cache
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          rm -rf target
          ln -s "$CARGO_TARGET_DIR" target

      # The committed pin was produced with the Arch rust package and
      # lld 23.1.3-4, not rustup and not the newest lld. Both the linker
      # version (in .comment) and the Cargo registry path (in dependency panic
      # locations) are embedded in the binaries, so reproduce them exactly.
      - name: Pin the compiler inputs
        run: |
          set -euo pipefail
          lld_version=23.1.3-4
          args=()
          for pkg in llvm-libs lld compiler-rt; do
            cached="/var/cache/pacman/pkg/${pkg}-${lld_version}-x86_64.pkg.tar.zst"
            if [[ -f "$cached" ]]; then
              args+=("$cached")
            else
              args+=("https://archive.archlinux.org/packages/${pkg:0:1}/${pkg}/${pkg}-${lld_version}-x86_64.pkg.tar.zst")
            fi
          done
          pacman -U --noconfirm "${args[@]}"
          mkdir -p /home/sam
          rm -rf /home/sam/.cargo
          ln -s /ci/cache/cargo /home/sam/.cargo
          ld.lld --version

      - name: Resolve the release tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The digest pin is only meaningful if the compiler is the one the pin
      # was produced with. 1.99.1 is the Rust release (commit 58cf8f9c3) the
      # version-bump PR used; the Arch container supplies the matching glibc,
      # gcc and binutils. Print the library versions so a mismatch is visible in
      # the log, and fail if rustc is not the pinned commit.
      - name: Verify the pinned toolchain
        run: |
          set -euo pipefail
          hash -r
          command -v rustc
          command -v cargo
          rustc -vV
          cargo --version
          ld.lld --version
          pacman -Q rust lld llvm-libs compiler-rt glibc gcc binutils zip
          test "$(rustc -vV | sed -n 's/^release: //p')" = "1.99.1"
          test "$(rustc -vV | sed -n 's/^commit-hash: //p')" = "58cf8f9c35b355199727627d07ae34a4e2846d67"
          cargo --version | grep -q '1.99.1'
          pacman -Q rust | grep -q '^rust 1:1.99.1-1$'
          ld.lld --version | grep -q 'LLD 23.1.3'
          test "$CARGO_HOME" = "/home/sam/.cargo"

      # Tag immutability guard. A re-pointed tag is the 0.2.5 failure: the tag
      # was moved to a commit that matched a hand-edited pin, so the "reviewed
      # tag" no longer described the tree the checks ran against.
      #
      # The annotated tag's own message embeds the commit it was created on. If
      # the tag now resolves somewhere else, the tag object was rewritten or the
      # annotated tag was replaced by a lightweight one. Either way the published
      # artifact would not correspond to the reviewed tag.
      - name: Refuse a tag that no longer points at its original commit
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          # `git cat-file -t` distinguishes an annotated tag object from a plain
          # commit; a release tag must be annotated and signed.
          if [[ "$(git cat-file -t "refs/tags/${tag}" 2>/dev/null || echo missing)" != "tag" ]]; then
            echo "error: ${tag} is not an annotated tag" >&2
            echo "       release tags must be signed (git tag -s) so the tag object" >&2
            echo "       records the commit it was created on" >&2
            exit 1
          fi
          tagged="$(git rev-parse "refs/tags/${tag}^{commit}")"
          echo "tag ${tag} -> ${tagged}"
          # The tagger's dereferenced commit must be an ancestor of, or equal to,
          # the checked-out commit that is about to be built.
          if ! git merge-base --is-ancestor "$tagged" HEAD; then
            echo "error: ${tag} points at ${tagged}, which is not an ancestor of the" >&2
            echo "       checked-out commit $(git rev-parse HEAD)" >&2
            exit 1
          fi

      # Same metadata and freeze checks the pre-tag gate ran, re-run on the
      # TAGGED tree. This is what closes the gap where the gate validated the
      # release branch but the tag pointed at a different merge commit.
      - name: Verify the release metadata agrees with the tagged version
        run: scripts/verify-release-metadata.sh "${{ steps.tag.outputs.version }}"

      - name: Verify no archive input changed since the pin
        run: scripts/archive-inputs.sh --check

      - name: Build the release archive
        run: scripts/package-release.sh "${{ steps.tag.outputs.version }}"

      # The archive and both binaries must match the digests committed in the
      # tagged tree. If this fails, the release is not the reviewed artifact:
      # fail before creating the GitHub release rather than re-pinning it.
      #
      # This uses the same script as the pre-tag gate
      # (`.github/workflows/prepare-release.yml`), so the check that runs before
      # a tag and the check that runs after it cannot drift apart. A green gate
      # therefore predicts a green release: that equivalence is the whole point,
      # and its absence is why 0.2.4 and 0.2.5 each needed a second attempt.
      - name: Verify the archive against the pinned digests
        run: scripts/verify-release-pin.sh "${{ steps.tag.outputs.version }}"

      # The AUR source hash is over the GitHub tag tarball, which only exists now.
      # This was a manual "remember to run updpkgsums" step that was missed for
      # three releases (the PKGBUILD still carried the 0.1.0 hash through
      # 0.2.5). Verify it against the real tarball and report the value, so the
      # AUR publish step is a copy rather than a judgement call.
      - name: Verify the PKGBUILD source hash against the tag tarball
        if: always()
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          version="${{ steps.tag.outputs.version }}"
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${tag}.tar.gz"
          tmp="$(mktemp -d)"
          tarball="$tmp/${tag}.tar.gz"
          if ! curl -fsSL --retry 3 -o "$tarball" "$url"; then
            echo "::warning::could not download $url; PKGBUILD source hash not verified"
            rm -rf "$tmp"
            exit 0
          fi
          actual="$(sha256sum "$tarball" | awk '{print $1}')"
          PKGBUILD_TARBALL="$tarball" scripts/verify-release-metadata.sh "$version" || true
          {
            echo "### AUR PKGBUILD"
            echo
            echo '```'
            echo "pkgver=$version"
            echo "sha256sums=('$actual')"
            echo '```'
            echo
            echo "Copy this into packaging/PKGBUILD (or run \`updpkgsums\`) before"
            echo "publishing to the AUR."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$tmp"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Explicit token: `persist-credentials: false` above means the
          # checkout's git config carries no credential, so the release action
          # is the only step that receives one.
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: omavrything ${{ steps.tag.outputs.tag }}
          # The .sha256 asset is published for manual verification only. The
          # plugin's fetch-on-first-run bootstrap does NOT trust it: it verifies
          # the archive against the digest pinned in scripts/daemon-checksums.txt
          # (see scripts/fetch-daemon.sh), because the archive and this asset
          # live in the same mutable release.
          files: |
            dist/*.zip
            dist/*.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            omavrything ${{ steps.tag.outputs.tag }}

            Download the zip below, extract it, and run:

                sudo ./scripts/install.sh

            The single command installs the daemon, CLI, systemd unit, D-Bus
            policy, polkit action, man page, default config, and the shell
            plugin; creates the omavrything user; adds you to the omavrything
            group; reloads D-Bus; enables and starts the daemon; and installs,
            enables, and loads the shell plugin. The installer grants your
            session access to the daemon socket with an ACL, so the widget works
            immediately; the group change takes effect on your next login.

            See `docs/install.md` inside the archive for the full setup.
