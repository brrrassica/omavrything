name: Release

# Publishing a `v*` tag builds the release archive and creates a GitHub release
# with the zip attached. The workflow can also be run manually against an
# existing tag from the Actions tab.
#
# The archive is built inside an official Arch container so the shipped binaries
# are linked against the same glibc and toolchain as the target platform
# (Omarchy Quattro / Arch Linux).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish release (Arch)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed --overwrite '*' git curl zip

      - uses: actions/checkout@v4
        with:
          # Check out the tag being released, not the default branch.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve the release tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build the release archive
        run: scripts/package-release.sh "${{ steps.tag.outputs.version }}"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: omavrything ${{ steps.tag.outputs.tag }}
          files: dist/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            omavrything ${{ steps.tag.outputs.tag }}

            Download the zip below, extract it, and run:

                sudo ./scripts/install.sh --system
                ./scripts/install-plugin.sh
                omarchy plugin enable omavrything --section center

            See `docs/install.md` inside the archive for the full setup.
