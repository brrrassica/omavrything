name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# ---------------------------------------------------------------------------
# Local package caches
#
# Every job that runs inside a container bind-mounts subdirectories of
# /home/github-runner/ci-cache on the runner host:
#
#   pacman-pkg -> /var/cache/pacman/pkg   downloaded Arch packages
#   cargo      -> $CARGO_HOME             the crates.io registry + cargo binaries
#   rustup     -> $RUSTUP_HOME            installed Rust toolchains
#   targets    -> $CARGO_TARGET_DIR       compiled build artifacts
#   locks      -> serialises pacman/apt   so parallel runners cannot corrupt it
#
# The first run after this change downloads everything once; every run after it
# is served entirely from the runner's own disk, with no internet fetches for
# packages, crates or toolchains.
#
# Toolchains are PINNED: both the `RUSTUP_TOOLCHAIN` env and the `toolchain:`
# input below name an exact release (stable 1.99.1, nightly-2026-10-22) instead
# of the floating `stable`/`nightly` channels. A floating channel makes rustup
# re-resolve the channel over the network on every run, and a nightly newer than
# the cached one forces a full re-download into the shared RUSTUP_HOME (which is
# what broke the fuzz job). Bump both values together to move to a newer
# compiler, then let the first run repopulate the cache.
#
# Two further details make that reuse actually happen:
#
#   * Each job puts $CARGO_HOME/bin on PATH before the toolchain step. rustup is
#     not on PATH inside a bare archlinux container even though the cached shims
#     live there, so without this dtolnay/rust-toolchain re-downloads the rustup
#     installer on every run (~1-2 min) and trips over
#     "HOME differs from euid-obtained home directory".
#
#   * The toolchain is installed under flock /ci/cache/locks/rustup.lock. The
#     push and pull_request runs of the same commit can otherwise install a
#     not-yet-cached toolchain into the shared downloads dir at the same time,
#     and one of them dies with "could not rename '...partial' ...".
# ---------------------------------------------------------------------------

jobs:
  # The target platform is Arch/Omarchy, so the build, test, and package jobs run
  # inside an official Arch container rather than on the Ubuntu host. This keeps
  # the toolchain, glibc, and package availability identical to what users run.
  build:
    name: fmt, clippy, test, build (Arch)
    runs-on: [self-hosted, opencode-sam]
    container:
      image: archlinux:base-devel
      volumes:
        - /home/github-runner/ci-cache/pacman-pkg:/var/cache/pacman/pkg
        - /home/github-runner/ci-cache/cargo:/ci/cache/cargo
        - /home/github-runner/ci-cache/rustup:/ci/cache/rustup
        - /home/github-runner/ci-cache/targets:/ci/cache/targets
        - /home/github-runner/ci-cache/locks:/ci/cache/locks
    env:
      CARGO_HOME: /ci/cache/cargo
      RUSTUP_HOME: /ci/cache/rustup
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_TARGET_DIR: /ci/cache/targets/${{ github.repository }}/${{ github.job }}
    steps:
      - name: Install dependencies (from the local pacman cache)
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          flock /ci/cache/locks/pacman.lock \
            pacman -Syu --noconfirm --needed --overwrite '*' git curl

      - uses: actions/checkout@v4

      # The build output lives in the runner's persistent cache, but the
      # repo's own scripts (scripts/build.sh, ci-smoke.sh, package-release.sh)
      # reference ./target, so link it back to the cache.
      - name: Point target/ at the persistent local cache
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          rm -rf target
          ln -s "$CARGO_TARGET_DIR" target
      - name: Put the cached cargo/rustup shims on PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      # Install under the cache lock so the action below only has to confirm
      # the toolchain is already present.
      - name: Pre-install the pinned toolchain under the cache lock
        run: |
          flock /ci/cache/locks/rustup.lock \
            rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update \
              --component rustfmt --component clippy

      - name: Install Rust toolchain (reused from RUSTUP_HOME)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Test (release)
        run: cargo test --release --all-features

      - name: Build
        run: cargo build --all-features

  qml:
    name: qmllint (Arch)
    runs-on: [self-hosted, opencode-sam]
    container: archlinux:base-devel
    needs: build
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed --overwrite '*' git qt6-declarative

      - uses: actions/checkout@v4

      - name: Lint the shell plugin QML
        run: scripts/lint-qml.sh

  fuzz:
    name: fuzz (smoke, Arch)
    runs-on: [self-hosted, opencode-sam]
    container:
      image: archlinux:base-devel
      volumes:
        - /home/github-runner/ci-cache/pacman-pkg:/var/cache/pacman/pkg
        - /home/github-runner/ci-cache/cargo:/ci/cache/cargo
        - /home/github-runner/ci-cache/rustup:/ci/cache/rustup
        - /home/github-runner/ci-cache/targets:/ci/cache/targets
        - /home/github-runner/ci-cache/locks:/ci/cache/locks
    env:
      CARGO_HOME: /ci/cache/cargo
      RUSTUP_HOME: /ci/cache/rustup
      RUSTUP_TOOLCHAIN: nightly-2026-10-22
      CARGO_TARGET_DIR: /ci/cache/targets/${{ github.repository }}/${{ github.job }}
    steps:
      - name: Install dependencies (from the local pacman cache)
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          flock /ci/cache/locks/pacman.lock \
            pacman -Syu --noconfirm --needed --overwrite '*' git curl

      - uses: actions/checkout@v4

      # The build output lives in the runner's persistent cache, but the
      # repo's own scripts (scripts/build.sh, ci-smoke.sh, package-release.sh)
      # reference ./target, so link it back to the cache.
      - name: Point target/ at the persistent local cache
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          rm -rf target
          ln -s "$CARGO_TARGET_DIR" target
      # cargo-fuzz keeps its artifacts in fuzz/target, which lives in the
      # (throw-away) checkout. Point it at the persistent local cache instead.
      - name: Point the fuzz target dir at the local cache
        run: |
          rm -rf fuzz/target
          ln -s "$CARGO_TARGET_DIR" fuzz/target

      - name: Put the cached cargo/rustup shims on PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      # Install under the cache lock so the action below only has to confirm
      # the toolchain is already present.
      - name: Pre-install the pinned toolchain under the cache lock
        run: |
          flock /ci/cache/locks/rustup.lock \
            rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - name: Install nightly toolchain (reused from RUSTUP_HOME)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-22

      - name: Install cargo-fuzz (reused from CARGO_HOME)
        run: cargo install cargo-fuzz --locked

      - name: Fuzz the snapshot loader
        working-directory: fuzz
        run: cargo fuzz run snapshot_decode -- -max_total_time=60 -rss_limit_mb=2048

      - name: Fuzz the protocol parser
        working-directory: fuzz
        run: cargo fuzz run protocol_parse -- -max_total_time=60 -rss_limit_mb=2048

  # Dependency advisories are platform-independent (they only read Cargo.lock),
  # so this job runs on the self-hosted runner alongside the rest. It executes on
  # the host rather than in a container, where ~/.cargo and ~/.rustup are already
  # persistent, so its crates and toolchain are cached locally too.
  audit:
    name: cargo audit
    runs-on: [self-hosted, opencode-sam]
    permissions:
      contents: read
      issues: write
      # rustsec/audit-check reports unmaintained-crate warnings as a check run,
      # which fails with "Resource not accessible by integration" without this.
      checks: write
    steps:
      - uses: actions/checkout@v4
      # This job runs on the host, not in a container, so it uses the runner's
      # own ~/.cargo and ~/.rustup: there is no shared cache to lock against.
      - name: Put the cached cargo/rustup shims on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: install/uninstall smoke (Arch)
    runs-on: [self-hosted, opencode-sam]
    container:
      image: archlinux:base-devel
      volumes:
        - /home/github-runner/ci-cache/pacman-pkg:/var/cache/pacman/pkg
        - /home/github-runner/ci-cache/cargo:/ci/cache/cargo
        - /home/github-runner/ci-cache/rustup:/ci/cache/rustup
        - /home/github-runner/ci-cache/targets:/ci/cache/targets
        - /home/github-runner/ci-cache/locks:/ci/cache/locks
    env:
      CARGO_HOME: /ci/cache/cargo
      RUSTUP_HOME: /ci/cache/rustup
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_TARGET_DIR: /ci/cache/targets/${{ github.repository }}/${{ github.job }}
    needs: build
    steps:
      - name: Install dependencies (from the local pacman cache)
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          flock /ci/cache/locks/pacman.lock \
            pacman -Syu --noconfirm --needed --overwrite '*' git curl zip

      - uses: actions/checkout@v4

      # The build output lives in the runner's persistent cache, but the
      # repo's own scripts (scripts/build.sh, ci-smoke.sh, package-release.sh)
      # reference ./target, so link it back to the cache.
      - name: Point target/ at the persistent local cache
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          rm -rf target
          ln -s "$CARGO_TARGET_DIR" target
      - name: Put the cached cargo/rustup shims on PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      # Install under the cache lock so the action below only has to confirm
      # the toolchain is already present.
      - name: Pre-install the pinned toolchain under the cache lock
        run: |
          flock /ci/cache/locks/rustup.lock \
            rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - name: Install Rust toolchain (reused from RUSTUP_HOME)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Run the install/uninstall smoke test
        run: scripts/ci-smoke.sh

  bench:
    name: performance budgets (Arch)
    runs-on: [self-hosted, opencode-sam]
    container:
      image: archlinux:base-devel
      volumes:
        - /home/github-runner/ci-cache/pacman-pkg:/var/cache/pacman/pkg
        - /home/github-runner/ci-cache/cargo:/ci/cache/cargo
        - /home/github-runner/ci-cache/rustup:/ci/cache/rustup
        - /home/github-runner/ci-cache/targets:/ci/cache/targets
        - /home/github-runner/ci-cache/locks:/ci/cache/locks
    env:
      CARGO_HOME: /ci/cache/cargo
      RUSTUP_HOME: /ci/cache/rustup
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_TARGET_DIR: /ci/cache/targets/${{ github.repository }}/${{ github.job }}
    needs: build
    steps:
      - name: Install dependencies (from the local pacman cache)
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          flock /ci/cache/locks/pacman.lock \
            pacman -Syu --noconfirm --needed --overwrite '*' git curl python

      - uses: actions/checkout@v4

      # The build output lives in the runner's persistent cache, but the
      # repo's own scripts (scripts/build.sh, ci-smoke.sh, package-release.sh)
      # reference ./target, so link it back to the cache.
      - name: Point target/ at the persistent local cache
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          rm -rf target
          ln -s "$CARGO_TARGET_DIR" target
      - name: Put the cached cargo/rustup shims on PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      # Install under the cache lock so the action below only has to confirm
      # the toolchain is already present.
      - name: Pre-install the pinned toolchain under the cache lock
        run: |
          flock /ci/cache/locks/rustup.lock \
            rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - name: Install Rust toolchain (reused from RUSTUP_HOME)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Build the daemon and CLI (release)
        run: cargo build --release -p omavrythingd -p omavrything-cli

      - name: Run the performance budgets
        run: scripts/benchmark.sh --quick --hermetic --budgets

  package:
    name: package release archive (Arch)
    runs-on: [self-hosted, opencode-sam]
    container:
      image: archlinux:base-devel
      volumes:
        - /home/github-runner/ci-cache/pacman-pkg:/var/cache/pacman/pkg
        - /home/github-runner/ci-cache/cargo:/ci/cache/cargo
        - /home/github-runner/ci-cache/rustup:/ci/cache/rustup
        - /home/github-runner/ci-cache/targets:/ci/cache/targets
        - /home/github-runner/ci-cache/locks:/ci/cache/locks
    env:
      CARGO_HOME: /ci/cache/cargo
      RUSTUP_HOME: /ci/cache/rustup
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_TARGET_DIR: /ci/cache/targets/${{ github.repository }}/${{ github.job }}
    needs: build
    steps:
      - name: Install dependencies (from the local pacman cache)
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          flock /ci/cache/locks/pacman.lock \
            pacman -Syu --noconfirm --needed --overwrite '*' git curl zip

      - uses: actions/checkout@v4

      # The build output lives in the runner's persistent cache, but the
      # repo's own scripts (scripts/build.sh, ci-smoke.sh, package-release.sh)
      # reference ./target, so link it back to the cache.
      - name: Point target/ at the persistent local cache
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          rm -rf target
          ln -s "$CARGO_TARGET_DIR" target
      - name: Put the cached cargo/rustup shims on PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      # Install under the cache lock so the action below only has to confirm
      # the toolchain is already present.
      - name: Pre-install the pinned toolchain under the cache lock
        run: |
          flock /ci/cache/locks/rustup.lock \
            rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - name: Install Rust toolchain (reused from RUSTUP_HOME)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Build the release archive
        run: scripts/package-release.sh

      - name: Upload the release archive
        uses: actions/upload-artifact@v4
        with:
          name: omavrything-release-archive
          path: dist/*.zip
          if-no-files-found: error