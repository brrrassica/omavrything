name: Docs site

# Builds the static documentation site (site/build.py) and publishes it to GitHub
# Pages, which serves the mirror at https://brrrassica.github.io/omavrything.
# The canonical copy at https://omavrything.alatcerdas.tech is deployed from the
# same generated output.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'assets/**'
      - 'README.md'
      - 'manifest.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; only keep the newest queued run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install -r site/requirements.txt

      - name: Build the site
        run: python site/build.py --out _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
