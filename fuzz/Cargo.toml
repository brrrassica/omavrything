[package]
name = "omavrything-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# The fuzz crate is its own workspace so it is not built by the main workspace
# (it requires a nightly toolchain and the libFuzzer runtime).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
omavrything-core = { path = "../crates/omavrything-core" }

[[bin]]
name = "snapshot_decode"
path = "fuzz_targets/snapshot_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_parse"
path = "fuzz_targets/protocol_parse.rs"
test = false
doc = false
bench = false
