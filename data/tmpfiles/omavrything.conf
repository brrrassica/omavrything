# Type Path                Mode  User         Group        Age Argument
d     /run/omavrything     0750  omavrything  omavrything  -   -
# Persistent state: the index snapshot and the state config (remembered
# volumes, runtime settings). The daemon runs as `omavrything` and cannot
# create this under root-owned /var/lib itself, so tmpfiles creates it with
# the right ownership on install and on every boot.
d     /var/lib/omavrything 0750  omavrything  omavrything  -   -
