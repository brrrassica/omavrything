# The dedicated user and group the omavrythingd system service runs as.
#
# Members of the `omavrything` group may connect to the daemon's Unix socket
# (mode 0660, group `omavrything`). Add a user with:
#
#   sudo usermod -aG omavrything <user>
#
# The home directory is created by the service's StateDirectory= setting.
u omavrything - "omavrything index daemon" /var/lib/omavrything
