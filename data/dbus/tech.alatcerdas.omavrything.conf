<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The daemon owns the well-known name. It runs as the dedicated
       `omavrything` user (or root for a user-run daemon). -->
  <policy user="root">
    <allow own="tech.alatcerdas.omavrything"/>
  </policy>
  <policy user="omavrything">
    <allow own="tech.alatcerdas.omavrything"/>
  </policy>

  <!-- Read-only methods and signals are available to everyone. -->
  <policy context="default">
    <allow send_destination="tech.alatcerdas.omavrything"
           send_interface="tech.alatcerdas.omavrything.Manager"
           send_member="GetStatus"/>
    <allow send_destination="tech.alatcerdas.omavrything"
           send_interface="tech.alatcerdas.omavrything.Manager"
           send_member="GetConfig"/>
    <allow send_destination="tech.alatcerdas.omavrything"
           send_interface="tech.alatcerdas.omavrything.Manager"
           send_member="ListRoots"/>
    <allow receive_sender="tech.alatcerdas.omavrything"/>
  </policy>

  <!-- Control methods are allowed on the bus; the daemon enforces the
       tech.alatcerdas.omavrything.control polkit action (and
       tech.alatcerdas.omavrything.set-config for cosmetic SetConfig keys). -->
  <policy context="default">
    <allow send_destination="tech.alatcerdas.omavrything"
           send_interface="tech.alatcerdas.omavrything.Manager"
           send_member="Rescan"/>
    <allow send_destination="tech.alatcerdas.omavrything"
           send_interface="tech.alatcerdas.omavrything.Manager"
           send_member="SetConfig"/>
    <allow send_destination="tech.alatcerdas.omavrything"
           send_interface="tech.alatcerdas.omavrything.Manager"
           send_member="MountNtfs"/>
  </policy>
</busconfig>
