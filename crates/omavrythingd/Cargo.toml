[package]
name = "omavrythingd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The omavrything index daemon"

[[bin]]
name = "omavrythingd"
path = "src/main.rs"

[dependencies]
omavrything-core.workspace = true
omavrything-ntfs.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }
zbus = { workspace = true }
tokio = { workspace = true }
memmap2 = { workspace = true }

[dev-dependencies]
omavrything-ntfs = { workspace = true, features = ["test-image"] }
omavrything-client = { workspace = true }
